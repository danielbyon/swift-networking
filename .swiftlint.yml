# Repository-specific SwiftLint overlay for swift-networking.
# The shared swift-tooling baseline supplies the common lint policy.

disabled_rules:
  - incompatible_concurrency_annotation

included:
  - Sources
  - Tests

excluded:
  - .build
  - "**/.build/**"
  - "**/.swiftpm/**"
  - "**/Generated/**"
  - "**/*.generated.swift"
